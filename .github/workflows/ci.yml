name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx jest --no-coverage --forceExit

      - name: Check Expo config
        run: npx expo config --type public
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: test
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_DATABASE_URL: https://test.firebasedatabase.app
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: test
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test
          EXPO_PUBLIC_FIREBASE_APP_ID: test
          EXPO_PUBLIC_GOOGLE_CLOUD_VISION_API_KEY: test

      # The app ships for Android/iOS only (react-native-web is not a
      # dependency), so the build check bundles the Android target.
      - name: Export Android bundle (build check)
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: test
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_DATABASE_URL: https://test.firebasedatabase.app
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: test
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: test
          EXPO_PUBLIC_FIREBASE_APP_ID: test
          EXPO_PUBLIC_GOOGLE_CLOUD_VISION_API_KEY: test

  # Firebase security rules against the LOCAL emulators only. The project id
  # "demo-voice-rules" is local by design: no real project, no credentials.
  firebase-rules:
    name: Firebase rules (local emulators)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firebase emulators need Java 21 or later.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rules tests (emulators, demo project)
        run: npm run test:rules
